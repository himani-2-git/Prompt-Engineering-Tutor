# Streamlit Community Cloud puts free apps to sleep after ~12 hours without traffic.
# A commit counts as activity, so this pushes an empty commit every 10 hours.
# Optional: delete this file if you don't need the app always awake.
name: keep-alive
on:
  schedule:
    - cron: "17 */10 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive"
          git push
